version: '3.8'

services:
  api:
    build: .
    container_name: policysetu_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - .:/app
    restart: unless-stopped

  dashboard:
    build: .
    container_name: policysetu_dashboard
    command: streamlit run dashboard/monitor.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - .:/app
    depends_on:
      - api
    restart: unless-stopped
